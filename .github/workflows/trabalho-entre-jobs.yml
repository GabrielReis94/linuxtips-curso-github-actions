name: Vendo arquivos compartilhados entre steps


on:
   push:
     branches:
       - main

jobs:
  job_1:
    runs-on: ubuntu-latest
    steps:
      - name: Confere versão do Ubuntu
        run: cat /etc/os-release


      - name: Exibir uma mensagem
        run: echo " Estou fazendo curso de Github ections na Linuxtips" > mensagem.txt

  job_2:
    runs-on: ubuntu-latest
    steps:
      - name: Listando qualquer coisa dentro do diretorio  
        run: ls -lrt
      
      - name: Le conteudo do arquivo
        run: cat mensagem.txt