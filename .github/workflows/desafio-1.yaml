name: Validacao de Imagens de Container

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'alpine:latest'
        required: true
        default: 'nginx:latest'
        type: string

jobs:
  pipeline-seguranca:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: login docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 1 - baixar imagem do container
      - name: baixar imagem do container
        run: |
          docker pull ${{ github.event.inputs.image }}

      # Step 2 - Provar que a imagem realmente foi baixada e está disponível
      - name: Leitura da imagem
        run: |
          IMAGE_NAME=$(echo "${{ github.event.inputs.image }}" | cut -d ':' -f 1)
          docker images | grep $IMAGE_NAME}

      # Step 3 -  relatório
      - name: Scan com o Docker Scout
        uses: docker/scout-action@v1
        with:
          command: quickview,cves,recommendations,sbom
          image: ${{ github.event.inputs.image }}
          only-severities: critical,high