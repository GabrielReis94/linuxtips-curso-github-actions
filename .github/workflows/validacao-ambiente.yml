name: Workflow de Validação do Ambiente

on:
  workflow_dispatch:
    inputs:
      node-version:
        required: true
        type: choice
        options:
          - "17"
          - "18"


jobs:
  valida-ambiente:
    runs-on: ubuntu-latest
    steps:
      - name: Mostra o ambiente escolhido
        run: echo "Node ${{ inputs.node-version }} na branch ${{ github.ref_name }}"

  build-e-testes:
    needs: valida-ambiente                         # só roda se a validação passar
    uses: ./.github/workflows/build-e-testes.yml   # uses no nível do JOB
    with:
      node-version: ${{ inputs.node-version }}